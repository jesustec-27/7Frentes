<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7 FRENTES</title>
    
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos/map.css">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
    
</head>
<body>
    <div class="header-title">
        <h1><strong>7 FRENTES</strong></h1>
    </div>

    <button class="reset-button" id="resetBtn" onclick="resetView()">
        ← Regresar a vista original
    </button>

    <div id='map'></div>
    
    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoiamVzdXN0ZWMiLCJhIjoiY21nenpxcWdpMGNqaXc5cHRiMXQwbnEwdiJ9.XMZyTKKSqVwtfPion1tjvQ';
        
        const initialCenter = [-102.54997, 23.87671]; //Ubicación de México al comenzar
        const initialZoom = 4.2;
        
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: initialCenter,
            zoom: initialZoom
        });

        map.addControl(new mapboxgl.NavigationControl());
        
        // Datos de los conflictos
        const geojson = {
            type: 'Conflictos',
            features: [
                {
                    type: 'Feature',
                    geometry: {
                        type: 'Point',
                        coordinates: [-107.394, 24.8092]
                    },
                    properties: {
                        title: 'Violencia del Crimen Organizado',
                        description: 'Guerra entre cárteles (Sinaloa y CJNG) ha escalado dramáticamente. México clasificado como el 4to país con conflicto más extremo.',
                        type: 'violencia',
                        severity: 95
                    }
                },
                {
                    type: 'Feature',
                    geometry: {
                        type: 'Point',
                        coordinates: [-100.3161, 25.6866]
                    },
                    properties: {
                        title: 'Crisis Hídrica Nacional',
                        description: '71% del territorio enfrenta presión hídrica alta. 300 municipios con algún grado de sequía. Monterrey experimentó su "día cero".',
                        type: 'ambiental',
                        severity: 85
                    }
                },
                {
                    type: 'Feature',
                    geometry: {
                        type: 'Point',
                        coordinates: [-89.07186, 20.86565]
                    },
                    properties: {
                        title: 'Conflicto Tren Maya',
                        description: 'Más de 50 amparos por daños ambientales. 10 millones de árboles talados. Afecta 20 áreas naturales protegidas y derechos indígenas.',
                        type: 'ambiental',
                        severity: 80
                    }
                },
                {
                    type: 'Feature',
                    geometry: {
                        type: 'Point',
                        coordinates: [-95.0167, 16.35]
                    },
                    properties: {
                        title: 'Tren Interoceánico',
                        description: 'Deforestación masiva y contaminación de agua. Activista Arnoldo Nicolás Romero asesinado en enero 2025 por defender el territorio.',
                        type: 'ambiental',
                        severity: 75
                    }
                },
                {
                    type: 'Feature',
                    geometry: {
                        type: 'Point',
                        coordinates: [-99.1332, 19.4326]
                    },
                    properties: {
                        title: 'Violencia Electoral',
                        description: '37 candidatos asesinados en 2024. Cárteles y grupos de poder buscan controlar elecciones para proteger sus intereses.',
                        type: 'politico',
                        severity: 90
                    }
                },
                {
                    type: 'Feature',
                    geometry: {
                        type: 'Point',
                        coordinates: [-104.04922, 21.2328]
                    },
                    properties: {
                        title: 'Conflictos Territoriales',
                        description: 'Disputas por 25,000 hectáreas entre Nayarit y Jalisco. Caso Los Chimalapas (Oaxaca-Chiapas). Invasión de tierras por empresas privadas.',
                        type: 'social',
                        severity: 70
                    }
                },
                {
                    type: 'Feature',
                    geometry: {
                        type: 'Point',
                        coordinates: [-106.485, 31.7619]
                    },
                    properties: {
                        title: 'Crisis Migratoria y Presiones EE.UU.',
                        description: 'Trump amenaza con tarifas del 25% si México no controla migración y fentanilo. Tensión con T-MEC y soberanía nacional.',
                        type: 'politico',
                        severity: 80
                    }
                }
            ]
        };

        for (const feature of geojson.features) {
            const el = document.createElement('div');
            el.className = `marker marker-${feature.properties.type}`;

            // Evento de click para hacer zoom
            el.addEventListener('click', () => {
                // Hacer zoom al conflicto
                map.flyTo({
                    center: feature.geometry.coordinates,
                    zoom: 7,
                    duration: 1500,
                    essential: true
                });
                
                // Mostrar botón de reset
                document.getElementById('resetBtn').classList.add('visible');
            });

            // Crear popup
            const popup = new mapboxgl.Popup({ offset: 25 })
                .setHTML(
                    `<h3>${feature.properties.title}</h3>
                    <p>${feature.properties.description}</p>
                    <div class="popup-severity">
                        <span>Gravedad: ${feature.properties.severity}%</span>
                    </div>`
                );

            // Agregar marcador al mapa
            new mapboxgl.Marker(el)
                .setLngLat(feature.geometry.coordinates)
                .setPopup(popup)
                .addTo(map);
        }

        // Función para regresar a la vista original
        function resetView() {
            map.flyTo({
                center: initialCenter,
                zoom: initialZoom,
                duration: 1500,
                essential: true
            });
            
            // Ocultamos el botón si no se selecciona ningún marcador
            document.getElementById('resetBtn').classList.remove('visible');
        }
    </script>
</body>
</html>
